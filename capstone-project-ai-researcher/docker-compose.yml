# Ambiente local. O Postgres aqui é efêmero (sem volume) e nunca é o Cloud SQL do Bloco A —
# ele só existe pra desenvolvimento, e perde os dados a cada `docker compose down`.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_researcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_researcher
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - '8080:8080'
