server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Mesma lógica do rewrite do Firebase Hosting (C.5): /api/** vai pro serviço da API,
  # preservando o path completo. Tudo o mais cai no index.html (SPA).
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
